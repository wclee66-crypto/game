<!DOCTYPE html>
<html lang="ko" data-fs="md">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="스도쿠·낱말찾기·산수·상식퀴즈를 매일 조금씩. 날짜별 점수가 기록되는 치매 예방 두뇌 훈련 앱">
<title>새록 · 두뇌 훈련</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="icon" href="icons/favicon-64.png" sizes="64x64">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="새록">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;800;900&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="appbar" id="appbar">
  <button class="appbar__back" id="btnBack" hidden aria-label="뒤로">←</button>
  <svg class="seal" viewBox="0 0 100 100" aria-hidden="true">
    <rect width="100" height="100" rx="26" fill="currentColor"></rect>
    <g fill="#fff">
      <path d="M45 80 Q40.8 58.8 22 48 Q26.2 69.3 45 80 Z" opacity=".55"></path>
      <path d="M56 80 Q75.2 66.4 77 43 Q57.8 56.6 56 80 Z" opacity=".78"></path>
      <path d="M50 81 Q61.5 49 50 17 Q38.5 49 50 81 Z"></path>
    </g>
  </svg>
  <div class="appbar__title">
    <h1 id="appTitle">새록</h1>
    <p id="appSub">매일 조금씩, 기억이 새록새록</p>
  </div>
  <button class="appbar__gear" id="btnSettings" aria-label="설정">⚙</button>
</header>

<main id="view" class="view" tabindex="-1"></main>

<nav class="tabbar" id="tabbar" aria-label="게임 전환">
  <button class="tab" data-route="home"><span class="tab__lbl">홈</span></button>
  <button class="tab" data-route="games"><span class="tab__lbl">게임 고르기</span></button>
  <button class="tab" data-route="records"><span class="tab__lbl">나의 기록</span></button>
</nav>

<div class="modal-root" id="modalRoot" hidden></div>
<div class="toast" id="toast" hidden></div>

<!-- 인쇄(PDF 저장) 전용 영역 — 화면에는 보이지 않고 인쇄할 때만 나타난다 -->
<div id="printRoot" aria-hidden="true"></div>

<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script src="js/data/quiz-data.js"></script>
<script src="js/data/words.js"></script>
<script src="js/games/sudoku.js"></script>
<script src="js/games/wordsearch.js"></script>
<script src="js/games/math.js"></script>
<script src="js/games/quiz.js"></script>
<script src="js/games/spot.js"></script>
<script src="js/print.js"></script>
<script src="js/app.js"></script>
<script>
  /* 인터넷이 끊겨도 열리도록 (파일을 직접 열었을 때는 건너뜀) */
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
